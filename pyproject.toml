[project]
name = "polarstation"
version = "0.1.0"
description = "Tidy functions for polars"
readme = "README.md"
authors = [
    { name = "const-ae", email = "artjom31415@googlemail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "polars>=1.0",
    "numpy",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6",
    "jupyter-console>=6",
    "pyyaml>=6",
    "quarto>=0.1",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "pytest>=8",
    "quartodoc>=0.11.1",
    "plotnine>=0.15.4",
    "pyarrow>=24.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8 naming
    "UP",  # pyupgrade
]
